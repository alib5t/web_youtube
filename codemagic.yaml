workflows:
  ios-runner-app:
    name: iOS Runner.app Unsigned

    environment:
      flutter: stable
      xcode: latest

    scripts:
  - name: Safe iOS build (no signing)
    script: |
      flutter clean
      flutter pub get

      cd ios
      pod install
      cd ..

      export CODE_SIGNING_ALLOWED=NO
      export CODE_SIGNING_REQUIRED=NO

      flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
