workflows:
  ios-runner-app:
    name: iOS Runner.app Unsigned

    environment:
      flutter: stable
      xcode: latest

    scripts:
  - name: Build unsigned iOS app
    script: |
      flutter clean
      flutter pub get

      cd ios
      pod install
      cd ..

      flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
